version: '3.8'
services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: baji_zone
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  app:
    build: .
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/baji_zone?schema=public"
      NEXT_PUBLIC_BASE_URL: "http://localhost:3000"
      NEXT_PUBLIC_STRIPE_KEY: "pk_test_replace"
      STRIPE_SECRET_KEY: "sk_test_replace"
      JWT_SECRET: "change_this_secret"
    ports:
      - "3000:3000"
    depends_on:
      - db
    command: sh -c "npm install && npx prisma migrate deploy && npm run dev"

volumes:
  db-data:
